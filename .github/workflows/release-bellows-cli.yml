# Release workflow for the anvil-bellows CLI binary.
#
# Mirrors release-cli.yml — builds the `anvil-bellows` binary for every
# supported platform, drops it into the matching platform package, and
# publishes everything to npm.
#
# Triggered manually (workflow_dispatch) or on a `bellows-v*` git tag
# (e.g. `bellows-v0.2.0`).

name: release-bellows-cli

on:
  workflow_dispatch:
  push:
    tags:
      - "bellows-v*"

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  build-binary:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            package: anvil-bellows-cli-linux-x64
            bin: anvil-bellows
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            package: anvil-bellows-cli-linux-arm64
            bin: anvil-bellows
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            package: anvil-bellows-cli-darwin-x64
            bin: anvil-bellows
          - target: aarch64-apple-darwin
            os: macos-14
            package: anvil-bellows-cli-darwin-arm64
            bin: anvil-bellows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            package: anvil-bellows-cli-win32-x64
            bin: anvil-bellows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross (linux-arm64 only)
        if: matrix.cross == true
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release -p anvil-bellows --target ${{ matrix.target }}
          else
            cargo build --release -p anvil-bellows --target ${{ matrix.target }}
          fi
      - name: Stage binary into platform package
        shell: bash
        run: |
          mkdir -p packages/${{ matrix.package }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} \
             packages/${{ matrix.package }}/bin/${{ matrix.bin }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/bin/${{ matrix.bin }}

  publish:
    name: publish to npm
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage binaries into platform packages
        run: |
          for plat in anvil-bellows-cli-darwin-arm64 anvil-bellows-cli-darwin-x64 \
                      anvil-bellows-cli-linux-arm64 anvil-bellows-cli-linux-x64 \
                      anvil-bellows-cli-win32-x64; do
            mkdir -p packages/$plat/bin
            cp -r artifacts/$plat/* packages/$plat/bin/
          done

      - name: Publish per-platform packages
        run: |
          for plat in anvil-bellows-cli-darwin-arm64 anvil-bellows-cli-darwin-x64 \
                      anvil-bellows-cli-linux-arm64 anvil-bellows-cli-linux-x64 \
                      anvil-bellows-cli-win32-x64; do
            (cd packages/$plat && npm publish --provenance --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build + publish launcher
        run: |
          pnpm -C packages/anvil-bellows-cli run build
          (cd packages/anvil-bellows-cli && npm publish --provenance --access public)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
