# Release workflow for the anvil CLI binary.
#
# Builds `anvil-cli` for every supported platform, drops the resulting
# binary into the matching `packages/anvil-cli-<platform>-<arch>/bin/`
# directory, and publishes everything to npm.
#
# Triggered manually (workflow_dispatch) or on a `cli-v*` git tag.
# Each job builds one platform — fan-out via `strategy.matrix` keeps
# the wall-clock time bounded by the slowest target rather than the
# sum.
#
# Local maintainers can simulate the matrix on a single host by
# running `cargo build --release --target <triple>` for each entry —
# but the CI matrix is the canonical path.

name: release-cli

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  build-binary:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            package: anvil-cli-linux-x64
            bin: anvil
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            package: anvil-cli-linux-arm64
            bin: anvil
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13           # Intel runner — built natively
            package: anvil-cli-darwin-x64
            bin: anvil
          - target: aarch64-apple-darwin
            os: macos-14           # Apple Silicon runner
            package: anvil-cli-darwin-arm64
            bin: anvil
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            package: anvil-cli-win32-x64
            bin: anvil.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross (linux-arm64 only)
        if: matrix.cross == true
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release -p anvil-cli --target ${{ matrix.target }}
          else
            cargo build --release -p anvil-cli --target ${{ matrix.target }}
          fi
      - name: Stage binary into platform package
        shell: bash
        run: |
          mkdir -p packages/${{ matrix.package }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} \
             packages/${{ matrix.package }}/bin/${{ matrix.bin }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: packages/${{ matrix.package }}/bin/${{ matrix.bin }}

  publish:
    name: publish to npm
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage binaries into platform packages
        run: |
          for plat in anvil-cli-darwin-arm64 anvil-cli-darwin-x64 \
                      anvil-cli-linux-arm64 anvil-cli-linux-x64 \
                      anvil-cli-win32-x64; do
            mkdir -p packages/$plat/bin
            cp -r artifacts/$plat/* packages/$plat/bin/
          done
      - name: Publish per-platform packages
        run: |
          for plat in anvil-cli-darwin-arm64 anvil-cli-darwin-x64 \
                      anvil-cli-linux-arm64 anvil-cli-linux-x64 \
                      anvil-cli-win32-x64; do
            (cd packages/$plat && npm publish --provenance --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Build + publish launcher
        run: |
          pnpm install --frozen-lockfile
          pnpm -C packages/anvil-cli run build
          (cd packages/anvil-cli && npm publish --provenance --access public)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
