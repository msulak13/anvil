[package]
name = "tsdi-codegen-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "WASM bindings for the tsdi codegen pipeline. Same parser + graph + emitter as the native CLI, in-process for any host that can run WebAssembly."

# `cdylib` is the wasm-bindgen-required crate type. `rlib` keeps the
# crate usable from native test harnesses (so we can run the same
# golden-fixture suite against this code path without a wasm runtime).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tsdi-core   = { workspace = true }
tsdi-parser = { workspace = true }
tsdi-codegen = { workspace = true }
serde   = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# wasm-bindgen and serde-wasm-bindgen are only needed for the cdylib
# target. They're tiny enough to leave as unconditional deps; the rlib
# build links them but doesn't actually use the JS-interop entry
# points (that's a `#[wasm_bindgen]` thing).
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[lints]
workspace = true

# wasm-opt would shave ~30% off the .wasm size, but the version
# wasm-pack bundles doesn't enable bulk-memory by default and oxc
# emits `memory.copy` ops. Skip the post-process for now; the
# unoptimized blob still compresses well over the wire.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
